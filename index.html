<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para la sof</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #fff9c4 0%, #ffe082 50%, #ffd54f 100%);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .flower-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .falling-flower {
            position: absolute;
            top: -10%;
            font-size: 24px;
            animation: fall linear infinite;
            user-select: none;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.8);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(360deg) scale(1.2);
                opacity: 0.3;
            }
        }

       
        .card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            max-width: 420px;
            width: 90%;
            border: 2px solid #fff;
            animation: popUp 1s ease-out;
        }

        @keyframes popUp {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .emoji-header {
            font-size: 60px;
            margin-bottom: 15px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-15px); }
            60% { transform: translateY(-7px); }
        }

        h1 {
            color: #f57f17;
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        p {
            color: #5d4037;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn {
            background: linear-gradient(135deg, #fbc02d, #f57f17);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(245, 127, 23, 0.4);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(245, 127, 23, 0.6);
            background: linear-gradient(135deg, #f57f17, #fbc02d);
        }

        #secret-message {
            margin-top: 15px;
            font-size: 14px;
            color: #e65100;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

   
    <div class="flower-container" id="flowerContainer"></div>


    <div class="card">
        <div class="emoji-header">🌻</div>
        <h1>Para la Sof</h1>
        <p>yo no doy flores pero aqui estas pa vos sensillas pero con cariño mal caes aunq ni me hables te debo gomitas </p>
        <button class="btn" onclick="mostrarSorpresa()">¡Reclamar flores! ✨</button>
        <div id="secret-message">gran paja que no te dieron flores amarillas </div>
    </div>

    <script>
        
        function createFlower() {
            const container = document.getElementById('flowerContainer');
            const flower = document.createElement('div');
            flower.classList.add('falling-flower');
            
            const emojis = ['🌻', '🖕', '✨', '💛'];
            flower.innerText = emojis[Math.floor(Math.random() * emojis.length)];

            flower.style.left = Math.random() * 100 + 'vw';
            flower.style.animationDuration = (Math.random() * 3 + 3) + 's';
            flower.style.fontSize = (Math.random() * 20 + 16) + 'px';

            container.appendChild(flower);

            setTimeout(() => {
                flower.remove();
            }, 6000);
        }

        setInterval(createFlower, 300);

        function mostrarSorpresa() {
            const msg = document.getElementById('secret-message');
            msg.style.opacity = '1';
            
            for(let i = 0; i < 15; i++) {
                setTimeout(createFlower, i * 50);
            }
        }
    </script>
</body>
</html>
